<!DOCTYPE html>
<html lang="el">
<head>
    <title>Ιστορικό</title>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script src="{{ url_for('static', filename='js/search.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
        initLiveSearch();
    });
</script>
</head>
<body>

        <div class="history-container" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
            <h1 style="text-align: center; color: #333; margin-bottom: 1.5rem;">Ιστορικό Αναζητήσεων</h1>

             {% if searches %}
                <ol class="list-group list-group-numbered" style="padding: 0;">
                    {% for search in searches %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                {% if search.url %}
                                    <a href="{{ search.url }}" style="text-decoration: none; color: #1a73e8;">
                                        {{ search.location }}
                                    </a>
                                {% else %}
                                    {{ search.location }}
                            </div>
                            <form action="{{ url_for('delete_search', search_id=search.id) }}" method="post" style="margin:0;">
                                <button type="submit" class="btn btn-sm btn-danger">Διαγραφή</button>
                            </form>
                        </li>
                    {% endfor %}
                </ol>
            {% else %}
                <p style="text-align: center; color: #777;">Δεν υπάρχουν αναζητήσεις ακόμα.</p>
         {% endif %}
    
        </div>

{% extends "template.html" %}
{% block content %}
{% endblock %}

</body>
</html>
